<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SnapFull</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">SnapFull</span>
    <span id="plan-badge" class="badge">Free</span>
  </header>

  <button id="capture-btn" class="primary-btn">Capture full page</button>

  <p id="status" class="status" aria-live="polite"></p>

  <div id="usage-row" class="usage-row">
    <span id="usage-text">0 / 5 captures today</span>
  </div>

  <footer>
    <a href="#" id="upgrade-link">Upgrade</a>
    <a href="#" id="options-link">Options</a>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
